name: full simulation and ML

on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install the reproducible development environment
        run: python -m pip install -c constraints/py310-tested.txt ".[dev]"
      - name: Run all tests
        run: python -m pytest -q
